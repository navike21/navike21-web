name: 🚀 Deploy to Vercel

on:
  pull_request:
    branches:
      - develop
      - release
      - main
  push:
    branches:
      - develop
      - release
      - main

jobs:
  deploy:
    name: Deploy Preview/Staging/Production
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          github-comment: false
          alias-domains: |
            ${{ github.event_name == 'pull_request' && format('navike21-pr-{0}.vercel.app', github.event.pull_request.number) || '' }}

      - name: 💬 Comment PR with Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://navike21-pr-${prNumber}.vercel.app`;
            const deploymentUrl = '${{ steps.vercel-deploy.outputs.preview-url }}';

            const comment = `## ✅ Preview Deployment Ready!

            **Preview URL (stable per PR):** ${previewUrl}

            Built with commit **${{ github.event.pull_request.head.sha }}**

            This pull request is being automatically deployed with [vercel-action](https://github.com/amondnet/vercel-action).

            ---

            🔗 **Alternative URLs:**
            - Deployment URL: ${deploymentUrl}`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
