name: ✅ PR Gate (Quality → Sonar → Vercel)

on:
  pull_request:
    branches:
      - develop
      - release
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  checks: write
  deployments: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest

    env:
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v4
        with:
          version: 9.15.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 TypeScript check
        if: ${{ env.BASE_BRANCH != 'main' }}
        run: pnpm run typecheck

      - name: 🧹 ESLint check
        run: pnpm run lint

      - name: 💅 Prettier check
        run: pnpm run format:check

      - name: 🧪 Tests (no coverage)
        if: ${{ env.BASE_BRANCH == 'release' }}
        run: pnpm run test

      - name: 🧪 Tests with coverage (lcov)
        if: ${{ env.BASE_BRANCH == 'develop' }}
        run: pnpm run test:coverage

      - name: 🔎 SonarCloud Scan (wait quality gate)
        if: ${{ env.BASE_BRANCH == 'develop' }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: 🚀 Deploy Preview to Vercel (comment PR)
        if: ${{ env.BASE_BRANCH == 'develop' }}
        uses: amondnet/vercel-action@4b001a441d80e00aeed3680a3719d1d8b95998c5 # v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          github-comment: true
          alias-domains: |
            ${{ format('navike21-pr-{0}.vercel.app', github.event.pull_request.number) }}
