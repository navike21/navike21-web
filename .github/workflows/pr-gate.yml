name: ✅ PR Gate (Quality → Sonar → Vercel)

on:
  pull_request:
    branches:
      - develop
      - release
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  checks: write
  deployments: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest

    env:
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 9.15.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 TypeScript check
        if: ${{ env.BASE_BRANCH != 'main' }}
        run: pnpm run typecheck

      - name: 🧹 ESLint check
        run: pnpm run lint

      - name: 💅 Prettier check
        run: pnpm run format:check

      - name: 🧪 Tests (no coverage)
        if: ${{ env.BASE_BRANCH == 'release' }}
        run: pnpm run test

      - name: 🧪 Tests with coverage (lcov)
        if: ${{ env.BASE_BRANCH == 'develop' }}
        run: pnpm run test:coverage

      - name: 🔎 SonarCloud Scan (wait quality gate)
        if: ${{ env.BASE_BRANCH == 'develop' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: 🚀 Deploy Preview to Vercel (comment PR)
        if: ${{ env.BASE_BRANCH == 'develop' }}
        uses: amondnet/vercel-action@c71810f8732de6b8656e41155e63b6303ca3e4bf # v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          github-comment: true
          alias-domains: |
            ${{ format('navike21-pr-{0}.vercel.app', github.event.pull_request.number) }}
