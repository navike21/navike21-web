name: 🧪 Test Quality Checks

on:
  push:
    branches:
      - release

jobs:
  test-quality:
    name: Test Suite & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v4
        with:
          version: 9.15.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Verify TypeScript version
        run: |
          echo "Expected TypeScript version: 5.9.3"
          pnpm list typescript --depth=0
          pnpm exec tsc --version

      - name: 🔍 TypeScript check
        run: pnpm run typecheck

      - name: 🧹 ESLint check
        run: pnpm run lint

      - name: 💅 Prettier check
        run: pnpm run format:check

      - name: 🏗️ Build check
        run: pnpm run build:ci

      # Placeholder for future test suites
      # - name: 🧪 Unit tests
      #   run: pnpm run test:unit

      # - name: 🎭 Integration tests
      #   run: pnpm run test:integration

      # - name: 📊 Coverage report
      #   run: pnpm run test:coverage
