# =========================
# SonarCloud Configuration
# =========================
sonar.organization=navike21
sonar.projectKey=navike21_navike21-web
sonar.projectName=navike21-web
sonar.host.url=https://sonarcloud.io

# =========================
# Source Configuration
# =========================
sonar.sources=src
sonar.sourceEncoding=UTF-8

# =========================
# Test Configuration
# =========================
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# =========================
# Coverage (Vitest LCOV)
# =========================
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# =========================
# Coverage Exclusions
# (alineado con Vitest, SIN romper index.tsx)
# =========================
sonar.coverage.exclusions=\
src/app/**,\
src/libs/assets/**,\
src/libs/sources/**,\
src/libs/i18n/**,\
src/**/constants/**,\
src/**/config/**,\
src/**/types/**,\
**/*.d.ts,\
**/*.stories.tsx,\
storybook-static/**

# =========================
# (Opcional pero recomendado)
# Excluir archivos no relevantes del análisis
# =========================
sonar.exclusions=\
node_modules/**,\
.next/**,\
out/**,\
coverage/**,\
storybook-static/**
