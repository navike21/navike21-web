# SonarQube Cloud (SonarCloud) configuration
# Fill these 2 values with your SonarCloud organization + project key.
sonar.organization=navike21
# SonarCloud project key (from your URL: https://sonarcloud.io/project/settings?id=navike21_navike21-web)
sonar.projectKey=navike21_navike21-web

# Optional (nice in the UI)
sonar.projectName=navike21-web

# SonarCloud host (optional; default is sonarcloud.io)
sonar.host.url=https://sonarcloud.io

# Source layout
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Tests live alongside source in this repo
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage (Vitest produces coverage/lcov.info with reporter: 'lcov')
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Keep analysis aligned with Vitest coverage exclusions
sonar.coverage.exclusions=src/app/**,src/libs/assets/**,src/libs/sources/**,src/libs/i18n/**,src/**/constants/**,src/**/config/**,src/**/types/**,**/*.d.ts,**/index.ts,**/*.stories.tsx,storybook-static/**
